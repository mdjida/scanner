<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Live Comp Scanner</title>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div id="app">

    <!-- Start screen -->
    <div id="start">
      <div class="logo">Live Comp</div>
      <p>Point your phone camera at a Pokémon card and tap the shutter.</p>
      <button class="btn btn-primary" id="btn-start">Open Camera</button>
    </div>

    <!-- Camera screen -->
    <div id="camera" style="display:none;">
      <video id="video" autoplay playsinline muted></video>
      <img id="fallback-img" alt="captured frame" />
      <div id="overlay">
        <div class="guide"></div>
        <div class="hint" id="camera-hint">Center the card in the frame</div>
      </div>
    </div>

    <!-- Settings -->
    <div id="settings">
      <label for="backend-url">Backend URL (PC IP)</label>
      <input type="text" id="backend-url" placeholder="http://192.168.1.100:8000" />
      <button class="btn btn-primary" id="btn-save">Save</button>
      <button class="btn btn-secondary" id="btn-discover">Auto-discover</button>
      <div id="settings-status"></div>
    </div>

    <!-- Controls / Result -->
    <div id="controls" style="display:none;">
      <div id="status">Ready</div>
      <button class="btn btn-primary" id="btn-scan">Scan Card</button>
      <button class="btn btn-secondary" id="btn-settings">Settings</button>
      <div id="result"></div>
    </div>

  </div>

  <script src="mobile.js"></script>
</body>
</html>
