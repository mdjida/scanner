name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test iOS App (Simulator)
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available destinations
        run: xcodebuild -project LiveCompOverlay.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild clean build \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlay \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=18.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Build Broadcast Extension
        run: |
          xcodebuild clean build \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlayBroadcast \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=18.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Build Widget Extension
        run: |
          xcodebuild clean build \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlayWidget \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=18.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            DerivedData/Logs/
            /Users/runner/Library/Logs/DiagnosticReports/

      - name: Export unsigned archive for AltStore (manual signing)
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild clean archive \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlay \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiveCompOverlay.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcbeautify || true
          # Create an unsigned .app payload for AltStore re-signing.
          mkdir -p Payload
          cp -R build/LiveCompOverlay.xcarchive/Products/Applications/LiveCompOverlay.app Payload/
          cp -R build/LiveCompOverlay.xcarchive/Products/Applications/LiveCompOverlayBroadcast.appex Payload/LiveCompOverlay.app/PlugIns/ 2>/dev/null || true
          cp -R build/LiveCompOverlay.xcarchive/Products/Applications/LiveCompOverlayWidget.appex Payload/LiveCompOverlay.app/PlugIns/ 2>/dev/null || true
          zip -r LiveCompOverlay-unsigned.ipa Payload

      - name: Upload unsigned IPA
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: LiveCompOverlay-unsigned-ipa
          path: LiveCompOverlay-unsigned.ipa
