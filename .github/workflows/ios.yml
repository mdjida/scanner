name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test iOS App (Simulator)
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --project project.yml 2>&1 | tee xcodegen.log
          exit ${PIPESTATUS[0]}

      - name: Upload xcodegen log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-log
          path: xcodegen.log

      - name: Show available destinations
        run: xcodebuild -project LiveCompOverlay.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          xcodebuild clean build \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlay \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Build Broadcast Extension
        run: |
          xcodebuild clean build \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlayBroadcast \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Build Widget Extension
        run: |
          xcodebuild clean build \
            -project LiveCompOverlay.xcodeproj \
            -scheme LiveCompOverlayWidget \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            DerivedData/Logs/
            /Users/runner/Library/Logs/DiagnosticReports/
