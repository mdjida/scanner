<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #111827;
      color: #e5e7eb;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #fff;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #9ca3af;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #818cf8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
    }
    .ok { color: #34c759; }
    .err { color: #ef4444; }
    .info {
      margin-top: 12px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Live Comp Overlay</h1>
  <label for="backend-url">Backend URL</label>
  <input id="backend-url" type="text" value="http://localhost:8000" />
  <button id="save">Save</button>
  <button id="test" style="margin-top:8px;background:#374151;">Test Connection</button>
  <div id="status"></div>
  <div class="info">
    Open Whatnot, Twitch, or YouTube and click the [scan] button to scan cards.
  </div>
  <script src="popup.js"></script>
</body>
</html>
